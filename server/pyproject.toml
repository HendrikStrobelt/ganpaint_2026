[project]
name = "ganpaint-server"
version = "0.1.0"
description = "FastAPI backend for GANPaint: paints concepts into ProGAN church images by editing layer4 units"
requires-python = ">=3.11"
dependencies = [
  "ganpaint-pipeline",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pillow",
  "numpy>=2",
  "huggingface_hub",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv.sources]
ganpaint-pipeline = { path = "../pipeline", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ganpaint_server"]
